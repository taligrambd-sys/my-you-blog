<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNteach - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #1a1a1a; color: #fff; padding: 20px; }
        .admin-box { max-width: 700px; margin: 40px auto; background: #262626; padding: 30px; border-radius: 8px; border: 1px solid #333; }
        .logo-preview { font-weight: bold; font-size: 24px; text-align: center; margin-bottom: 25px; }
        .logo-preview span { background-color: #ff9900; color: #000; padding: 2px 6px; border-radius: 4px; margin-left: 4px; font-weight: 900; }
        h2 { text-align: center; margin-bottom: 20px; color: #ff9900; font-size: 20px; }
        label { display: block; margin-bottom: 8px; color: #bbb; font-size: 14px; }
        input[type="email"], input[type="password"], input[type="text"], textarea { width: 100%; padding: 12px; margin-bottom: 20px; background: #111; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 15px; }
        input:focus, textarea:focus { border-color: #ff9900; outline: none; }
        textarea { height: 200px; font-family: monospace; }
        button { width: 100%; background: #ff9900; color: #000; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #e68a00; }
        .msg { text-align: center; margin-top: 15px; font-weight: bold; }
        .hidden { display: none; }
        
        /* Manage Posts Styles */
        .manage-section { margin-top: 40px; border-top: 1px solid #444; padding-top: 20px; }
        .manage-title { color: #ff9900; font-size: 18px; margin-bottom: 15px; border-left: 3px solid #ff9900; padding-left: 8px; }
        .post-list-item { background: #111; padding: 12px; border-radius: 4px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .post-list-title { font-size: 14px; color: #eee; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }
        .action-btns { display: flex; gap: 8px; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .edit-btn { background: #0088cc; color: #fff; }
        .edit-btn:hover { background: #006699; }
        .delete-btn { background: #ff3333; color: #fff; }
        .delete-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

    <div class="admin-box">
        <div class="logo-preview">BN<span>teach</span> Admin</div>
        
        <div id="loginSection">
            <h2>এডমিন লগইন</h2>
            <form id="loginForm">
                <label>イমেইল এড্রেস:</label>
                <input type="email" id="loginEmail" placeholder="আপনার এডমিন ইমেইল..." required>
                <label>পাসওয়ার্ড:</label>
                <input type="password" id="loginPassword" placeholder="আপনার পাসওয়ার্ড..." required>
                <button type="submit" id="loginBtn">লগইন করুন</button>
            </form>
        </div>

        <div id="postSection" class="hidden">
            <h2 id="formTitle">নতুন ব্লগ পোস্ট তৈরি করুন</h2>
            <form id="postForm">
                <input type="hidden" id="editPostId" value="">
                
                <label>블গ পোস্টের শিরোনাম (Title):</label>
                <input type="text" id="title" placeholder="এখানে শিরোনাম লিখুন..." required>
                
                <label>থাম্বনেইল ইমেজ লিঙ্ক (Thumbnail URL):</label>
                <input type="text" id="thumbnail" placeholder="https://example.com/image.jpg" required>
                
                <label>পোস্টের HTML ফাইল কোড (Paste HTML Code):</label>
                <textarea id="htmlContent" placeholder="আপনার আর্টিকেলের HTML কোড এখানে পেস্ট করুন..." required></textarea>
                
                <button type="submit" id="submitBtn">পাবলিশ করুন</button>
            </form>

            <div class="manage-section">
                <div class="manage-title">পোস্টসমূহ ম্যানেজ করুন</div>
                <div id="postListContainer">
                    <p style="color: #888; font-size: 14px;">লোড হচ্ছে...</p>
                </div>
            </div>
        </div>
        
        <div class="msg" id="msgBox"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getDatabase, ref, push, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCMFRYcecUSzi25cQfeRDgn7fhXz7QARWA",
            authDomain: "my-you-blog.firebaseapp.com",
            projectId: "my-you-blog",
            storageBucket: "my-you-blog.firebasestorage.app",
            messagingSenderId: "447217106827",
            appId: "1:447217106827:web:3571675938e84de8a5798e",
            measurementId: "G-SS1V1FCG2Z",
            databaseURL: "https://my-you-blog-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const loginSection = document.getElementById('loginSection');
        const postSection = document.getElementById('postSection');
        const msgBox = document.getElementById('msgBox');
        const postListContainer = document.getElementById('postListContainer');

        let allPostsData = {}; // এডিটের সময় ডেটা ক্যাচ করার জন্য গ্লোবাল অবজেক্ট

        // লগইন অবস্থা ট্র্যাক করা এবং লিস্ট লোড করা
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                postSection.classList.remove('hidden');
                msgBox.innerText = "";
                loadAdminPostList(); // লিস্ট লোড করার ফাংশন কল
            } else {
                loginSection.classList.remove('hidden');
                postSection.classList.add('hidden');
            }
        });

        // লগইন সাবমিট হ্যান্ডলার
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerText = "যাচাই করা হচ্ছে...";
            msgBox.innerText = "";

            signInWithEmailAndPassword(auth, email, password)
                .then(() => {
                    msgBox.style.color = "#00ff00";
                    msgBox.innerText = "লগইন সফল হয়েছে!";
                })
                .catch((error) => {
                    msgBox.style.color = "#ff0000";
                    msgBox.innerText = "ভুল ইমেইল বা পাসওয়ার্ড!";
                    loginBtn.disabled = false;
                    loginBtn.innerText = "লগইন করুন";
                });
        });

        // ডাটাবেজ থেকে সব পোস্ট এনে লিস্ট তৈরি করা
        function loadAdminPostList() {
            const postsRef = ref(db, 'posts');
            onValue(postsRef, (snapshot) => {
                postListContainer.innerHTML = "";
                const data = snapshot.val();
                if(!data) {
                    postListContainer.innerHTML = "<p style='color: #888; font-size: 14px;'>কোনো পোস্ট পাওয়া যায়নি।</p>";
                    return;
                }
                allPostsData = data; // গ্লোবাল ভেরিয়েবলে ডেটা স্টোর রাখা
                
                const keys = Object.keys(data).reverse(); // নতুন পোস্ট উপরে দেখাবে
                keys.forEach(key => {
                    const post = data[key];
                    const item = document.createElement('div');
                    item.className = 'post-list-item';
                    item.innerHTML = `
                        <div class="post-list-title">${post.title}</div>
                        <div class="action-btns">
                            <button class="action-btn edit-btn" data-id="${key}">এডিট</button>
                            <button class="action-btn delete-btn" data-id="${key}">ডিলিট</button>
                        </div>
                    `;
                    postListContainer.appendChild(item);
                });

                // এডিট বোতামের ইভেন্ট লিসেনার
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.target.getAttribute('data-id');
                        setupEditForm(id);
                    });
                });

                // ডিলিট বোতামের ইভেন্ট লিসেনার
                document.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const id = e.target.getAttribute('data-id');
                        if(confirm("আপনি কি নিশ্চিতভাবে এই পোস্টটি ডিলিট করতে চান?")) {
                            deletePost(id);
                        }
                    });
                });
            });
        }

        // এডিটের জন্য ফর্ম রেডি করা
        function setupEditForm(id) {
            const post = allPostsData[id];
            if(post) {
                document.getElementById('editPostId').value = id;
                document.getElementById('title').value = post.title;
                document.getElementById('thumbnail').value = post.thumbnail;
                document.getElementById('htmlContent').value = post.content;
                
                document.getElementById('formTitle').innerText = "পোস্ট পরিবর্তন/এডিট করুন";
                document.getElementById('submitBtn').innerText = "আপডেট করুন";
                window.scrollTo({ top: 0, behavior: 'smooth' }); // স্ক্রোল করে ফর্মে নিয়ে যাওয়া
            }
        }

        // পোস্ট ডিলিট করার ফাংশন
        function deletePost(id) {
            const postRef = ref(db, `posts/${id}`);
            remove(postRef)
                .then(() => {
                    msgBox.style.color = "#00ff00";
                    msgBox.innerText = "পোস্টটি সফলভাবে ডিলিট করা হয়েছে!";
                })
                .catch((error) => {
                    msgBox.style.color = "#ff0000";
                    msgBox.innerText = "ডিলিট করতে সমস্যা হয়েছে: " + error.message;
                });
        }

        // পোস্ট পাবলিশ এবং আপডেট হ্যান্ডলার
        document.getElementById('postForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const editId = document.getElementById('editPostId').value;
            const title = document.getElementById('title').value;
            const thumbnail = document.getElementById('thumbnail').value;
            const htmlContent = document.getElementById('htmlContent').value;
            
            const currentUser = auth.currentUser;
            if (!currentUser) {
                msgBox.style.color = "#ff0000";
                msgBox.innerText = "সেশন শেষ হয়ে গেছে! আবার লগইন করুন।";
                return;
            }

            btn.disabled = true;
            btn.innerText = editId ? "আপডেট হচ্ছে..." : "আপলোড হচ্ছে...";
            msgBox.innerText = "";
            
            let targetPostRef;
            if (editId) {
                // এডিট মোড হলে আগের নির্দিষ্ট আইডিতেই ডেটা ওভাররাইট হবে
                targetPostRef = ref(db, `posts/${editId}`);
            } else {
                // নতুন পোস্ট হলে নতুন আইডি তৈরি হবে
                const postsRef = ref(db, 'posts');
                targetPostRef = push(postsRef);
            }
            
            const postData = {
                title: title,
                thumbnail: thumbnail,
                content: htmlContent,
                updatedAt: Date.now()
            };
            
            if(!editId) {
                postData.createdAt = Date.now();
            } else {
                // পুরোনো ক্রিয়েশন টাইম ধরে রাখা (ঐচ্ছিক)
                if(allPostsData[editId] && allPostsData[editId].createdAt){
                    postData.createdAt = allPostsData[editId].createdAt;
                }
            }
            
            set(targetPostRef, postData)
            .then(() => {
                msgBox.style.color = "#00ff00";
                msgBox.innerText = editId ? "পোস্টটি সফলভাবে আপডেট হয়েছে!" : "পোস্টটি সফলভাবে পাবলিশ হয়েছে!";
                
                // ফর্ম রিসেট এবং আগের অবস্থায় ফেরত নেওয়া
                document.getElementById('postForm').reset();
                document.getElementById('editPostId').value = "";
                document.getElementById('formTitle').innerText = "নতুন ব্লগ পোস্ট তৈরি করুন";
                document.getElementById('submitBtn').innerText = "পাবলিশ করুন";
            })
            .catch((error) => {
                msgBox.style.color = "#ff0000";
                msgBox.innerText = "ভুল হয়েছে: " + error.message;
            })
            .finally(() => {
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
